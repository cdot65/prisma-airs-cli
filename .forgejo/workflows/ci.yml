# CI for airs-cli-rs. docs/TESTING.md ("Continuous integration") explains each job.
#
# Every test runs on loopback. AIRS_RS_LIVE is never set here: the live tier is run
# only by the maintainer, by hand.
name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

env:
  # pnpm/action-setup has no Node 24 major yet; force it (and any JS action) onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  # No debug info: smaller target/ (and cache), faster links. Tests do not need it.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
  MSRV: '1.89'
  PNPM_VERSION: '10.6.5'

jobs:
  linux:
    runs-on: prisma-airs-cli
    timeout-minutes: 120
    env:
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history: the change classifier diffs against the base commit.
          fetch-depth: 0

      - name: Classify the change (docs-only changes skip the Rust steps)
        id: changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # scripts/ci/classify-change.sh fails safe: any doubt means rust=true.
          scripts/ci/classify-change.sh "$base" | tee -a "$GITHUB_OUTPUT"
      - name: Install Rust (stable with rustfmt and clippy, plus the MSRV)
        id: rust
        run: |
          set -euo pipefail
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install "$MSRV" --profile minimal
          rustup default stable
          rustc --version
          cargo --version
          echo "key=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo cache
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/rust/cargo/registry/index
            /opt/rust/cargo/registry/cache
            /opt/rust/cargo/git/db
            target
          key: cargo-linux-${{ runner.arch }}-${{ steps.rust.outputs.key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-linux-${{ runner.arch }}-${{ steps.rust.outputs.key }}-

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changes.outputs.rust == 'true'
        with:
          node-version: 24

      - name: cargo fmt
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo check on the MSRV
        if: steps.changes.outputs.rust == 'true'
        run: cargo +"$MSRV" check --workspace --all-targets --locked --target-dir target/msrv

      - name: Install jq (tests/homebrew_formula.rs needs it; DESIGN §21.14 choice 51)
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo=""
            [ "$(id -u)" -eq 0 ] || sudo="sudo"
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends jq
          fi
          jq --version
          # tests/ci_scripts.rs runs scripts/ci/ci-status-ok.py.
          if ! command -v python3 >/dev/null 2>&1; then
            sudo=""
            [ "$(id -u)" -eq 0 ] || sudo="sudo"
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends python3
          fi
          python3 --version

      - name: cargo test
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          unset AIRS_RS_LIVE AIRS_E2E_TENANT AIRS_E2E_PROFILE
          # The job container has no CPU limit, so the test harness would otherwise run
          # one thread per host core (16 on the dedicated runner's node) while the musl
          # job compiles on the same cores. The runner is sized for 4 CPUs; the suite's
          # wall-clock tests (deadline, budget and lock-contention cases) need that
          # headroom to be real. Each test binary runs at most 4 tests at a time.
          export RUST_TEST_THREADS=4
          if [ "$(id -u)" -eq 0 ]; then
            # Some tests chmod a file to 0000 and expect it to be unreadable, which root
            # ignores. Run the suite as an unprivileged user.
            id ci >/dev/null 2>&1 || useradd --create-home --shell /bin/bash ci
            chown -R ci:ci "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"
            exec setpriv --reuid=ci --regid=ci --init-groups \
              env HOME=/home/ci RUST_TEST_THREADS=4 cargo test --workspace --locked --no-fail-fast
          fi
          cargo test --workspace --locked --no-fail-fast

      - name: cargo test (docs-only change; the two tests that read the docs)
        if: steps.changes.outputs.rust == 'false'
        run: |
          set -euo pipefail
          # docs_consistency checks README/DESIGN/COMPATIBILITY; cli_reference checks the
          # docs site's command reference against the CLI. Everything else cannot change.
          cargo test --locked --test docs_consistency --test cli_reference

  musl:
    runs-on: prisma-airs-cli
    timeout-minutes: 90
    env:
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      ZIG_VERSION: '0.17.0'
      CARGO_ZIGBUILD_VERSION: '0.23.4'
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history: the change classifier diffs against the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change (docs-only changes skip the Rust steps)
        id: changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # scripts/ci/classify-change.sh fails safe: any doubt means rust=true.
          scripts/ci/classify-change.sh "$base" | tee -a "$GITHUB_OUTPUT"
      - name: Install Rust (stable with the musl targets)
        id: rust
        run: |
          set -euo pipefail
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install stable --profile minimal \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          rustup default stable
          rustc --version
          echo "key=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install zig
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
            aarch64 | arm64) arch=aarch64; sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            *) echo "no zig build for $(uname -m)" >&2; exit 1 ;;
          esac
          name="zig-$arch-linux-$ZIG_VERSION"
          file="$RUNNER_TEMP/$name.tar.xz"
          downloaded=false
          # The trusted digest stays pinned above, never fetched from a mirror.
          # Bound every candidate; a slow origin must not consume the whole job.
          for url in \
            "https://zig.linus.dev/zig/$name.tar.xz?source=ci" \
            "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"; do
            if curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 600 -sSfL -o "$file.part" "$url" \
              && echo "$sum  $file.part" | sha256sum -c -; then
              mv "$file.part" "$file"
              downloaded=true
              break
            fi
          done
          if [ "$downloaded" != true ]; then
            rm -f "$file.part"
            echo "no checksum-verified Zig archive downloaded" >&2
            exit 1
          fi
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/zig" version

      - name: Restore the cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/rust/cargo/registry/index
            /opt/rust/cargo/registry/cache
            /opt/rust/cargo/git/db
            /opt/rust/cargo/bin/cargo-zigbuild
            target
          key: cargo-musl-${{ runner.arch }}-${{ steps.rust.outputs.key }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-musl-${{ runner.arch }}-${{ steps.rust.outputs.key }}-${{ env.CARGO_ZIGBUILD_VERSION }}-

      - name: Install cargo-zigbuild
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          if ! cargo-zigbuild --version 2>/dev/null | grep -qx "cargo-zigbuild $CARGO_ZIGBUILD_VERSION"; then
            cargo install --locked --force cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          fi
          cargo-zigbuild --version

      - name: Build x86_64-unknown-linux-musl
        if: steps.changes.outputs.rust == 'true'
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Build aarch64-unknown-linux-musl
        if: steps.changes.outputs.rust == 'true'
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Smoke test the native musl binary (loopback only)
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-musl ;;
            aarch64 | arm64) target=aarch64-unknown-linux-musl ;;
          esac
          bin="target/$target/release/airs"
          file "$bin" 2>/dev/null || true
          expected=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          got=$("$bin" --version)
          echo "--version: $got"
          [ "$got" = "$expected" ] || { echo "expected --version $expected" >&2; exit 1; }
          # The other names (DESIGN §21.2) are the same program.
          for name in airs-cli airs-cli-rs; do
            got=$("target/$target/release/$name" --version)
            echo "$name --version: $got"
            [ "$got" = "$expected" ] || { echo "expected $name --version $expected" >&2; exit 1; }
          done
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/home" "$smoke/store"
          chmod 0700 "$smoke/store"
          out=$(env -i PATH=/usr/bin:/bin HOME="$smoke/home" NO_COLOR=1 \
            AIRS_CLI_CONFIG_DIR="$smoke/store" "$bin" tenant list --output json)
          echo "tenant list: $out"
          [ "$out" = "[]" ] || { echo "expected [] from an empty store" >&2; exit 1; }

      - name: Stage the binaries
        if: steps.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p "dist/$target"
            cp "target/$target/release/airs" "dist/$target/"
            (cd "dist/$target" && sha256sum airs > airs.sha256)
          done

      # upload-artifact v4 refuses hosts other than github.com, and the
      # code.forgejo.org fork failed on this instance; v3 works.
      - uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: steps.changes.outputs.rust == 'true'
        with:
          name: airs-cli-x86_64-unknown-linux-musl
          path: dist/x86_64-unknown-linux-musl/
          if-no-files-found: error
          retention-days: 14

      - uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: steps.changes.outputs.rust == 'true'
        with:
          name: airs-cli-aarch64-unknown-linux-musl
          path: dist/aarch64-unknown-linux-musl/
          if-no-files-found: error
          retention-days: 14

  # The docs site (docs-site/, Docusaurus). onBrokenLinks and onBrokenAnchors are 'throw',
  # so a broken link or anchor fails this job. The command reference it publishes is
  # checked against the CLI by tests/cli_reference.rs in the linux job.
  docs-site:
    runs-on: prisma-airs-cli
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: docs-site/package.json

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install the docs-site dependencies
        run: pnpm -C docs-site install --frozen-lockfile

      - name: Build the docs site (broken links and anchors fail)
        run: pnpm -C docs-site build

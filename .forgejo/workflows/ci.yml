name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # pnpm/action-setup has no Node 24 major yet; force it (and any JS action) onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: node scripts/release/test-publish-boundary.mjs
      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - run: pnpm run lint
      - run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - run: pnpm tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - run: pnpm test:coverage
      - run: pnpm test:release
      - run: pnpm audit:prod

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - name: Generate API reference
        run: pnpm docs:api
      - run: pnpm -C docs-site install --frozen-lockfile
      # onBrokenLinks/onBrokenAnchors: 'throw' make this the strict build gate.
      - run: pnpm -C docs-site build

  consumer-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20.17.0', '22.13.0', '24']
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: https://github.com/actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - run: pnpm run build
      - name: Verify DLP authentication and transfer contracts through built CLI
        run: >-
          AIRS_CLI_ENTRY="$PWD/dist/cli/index.js" pnpm exec vitest run
          tests/integration/dlp-tenant-auth.spec.ts
          tests/integration/dlp-dictionary-errors.spec.ts
          tests/integration/dlp-profile-pattern-flags.spec.ts
          tests/integration/dlp-transfer-contract.spec.ts
      - name: Verify native DLP through built public CLI
        run: node .github/scripts/verify-dlp-consumer.mjs "$PWD/dist/cli/index.js"

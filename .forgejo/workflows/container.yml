name: Publish private CLI container
on:
  push:
    tags: ['v*-forgejo.*']
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate exact prerelease tag
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("package.json")); assert.match(p.version,/^\d+\.\d+\.\d+-forgejo\.\d+$/); assert.equal(process.env.GITHUB_REF,`refs/tags/v${p.version}`);'
          echo "IMAGE=registry.cdot.io/prisma-airs/prisma-airs-cli:$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm test:release
      - uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: registry.cdot.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Refuse existing version
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'Image version already exists; refusing overwrite.' >&2
            exit 1
          fi
      - uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
      - name: Verify published digest on both architectures
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --network none --platform "$platform" --entrypoint node \
              --mount "type=bind,source=$PWD/.github/scripts,target=/verification,readonly" \
              "registry.cdot.io/prisma-airs/prisma-airs-cli@$IMAGE_DIGEST" \
              /verification/verify-dlp-consumer.mjs /app/dist/cli/index.js
          done

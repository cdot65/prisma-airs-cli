name: Publish private CLI container
on:
  push:
    tags: ['v*-forgejo.*']
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: private-container-release
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate exact release source
        run: node scripts/release/container-policy.mjs
      - run: pnpm install --frozen-lockfile --store-dir /tmp/airs-pnpm-store
      - run: pnpm audit:prod
      - run: pnpm test:release
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: registry.cdot.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Resolve existing immutable version for verification-only retry
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>image-inspect-error.txt); then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo 'Existing version will be verified without rebuilding or overwriting.'
          elif grep -Eqi 'manifest unknown|not found' image-inspect-error.txt; then
            echo 'No existing version; build may proceed.'
          else
            echo 'Registry lookup failed; refusing to assume the version is absent.' >&2
            exit 1
          fi
      - uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        if: steps.existing.outputs.digest == ''
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
      - name: Verify published digest on both architectures
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          # BuildKit supplies its userspace emulator; Talos needs no binfmt mount.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "IMAGE=registry.cdot.io/prisma-airs/prisma-airs-cli@$IMAGE_DIGEST" \
            --file docker/verify.Dockerfile --progress plain .
      - name: Promote stable aliases only after digest verification
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/release/container-policy.mjs promote

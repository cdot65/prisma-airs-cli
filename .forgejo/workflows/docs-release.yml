name: Authorize GitHub Pages release
on:
  workflow_dispatch:
jobs:
  docs-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify required CI and tag exact source
        env:
          AIRS_RELEASE_TOKEN: ${{ secrets.AIRS_RELEASE_TOKEN }}
        run: node .forgejo/scripts/docs-release.mjs

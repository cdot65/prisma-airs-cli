<svg width="724" height="724" viewBox="0 0 724 724" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">prisma-airs-cli icon</title>
  <desc id="desc">A simplified Prisma AIRS shield icon with a compact command-line prompt in blue, cyan, and slate.</desc>

  <defs>
    <linearGradient id="shieldStroke" x1="108" y1="132" x2="508" y2="594" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A6CFF"/>
      <stop offset="0.52" stop-color="#149BFF"/>
      <stop offset="1" stop-color="#20C8C7"/>
    </linearGradient>
    <linearGradient id="airsMark" x1="200" y1="220" x2="382" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A6CFF"/>
      <stop offset="0.58" stop-color="#18B7DC"/>
      <stop offset="1" stop-color="#20C8C7"/>
    </linearGradient>
    <linearGradient id="airsWord" x1="1320" y1="245" x2="1710" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A6CFF"/>
      <stop offset="0.58" stop-color="#149BFF"/>
      <stop offset="1" stop-color="#20C8C7"/>
    </linearGradient>
  </defs>

  <g transform="translate(80 50) scale(1.0)">

  <g id="prisma-airs-cli-icon" stroke-linecap="round" stroke-linejoin="round">
    <!-- Simplified Prisma/AIRS shield outline. -->
    <path
      d="M116 365V255C116 242 123 230 134 224L282 138L430 224C441 230 448 242 448 255V356C448 463 382 548 282 594C246 577 212 558 182 532"
      fill="none"
      stroke="url(#shieldStroke)"
      stroke-width="34"/>

    <!-- Minimal AIRS-style prism/star, reduced from the original inner mark. -->
    <g fill="url(#airsMark)">
      <path d="M266 214C266 260 248 289 204 302H242C260 302 274 288 274 270V216C274 209 266 208 266 214Z"/>
      <path d="M298 214C298 260 316 289 360 302H322C304 302 290 288 290 270V216C290 209 298 208 298 214Z"/>
      <path d="M204 338C248 351 266 380 266 426C266 432 274 431 274 424V370C274 352 260 338 242 338H204Z"/>
      <path d="M360 338C316 351 298 380 298 426C298 432 290 431 290 424V370C290 352 304 338 322 338H360Z"/>
      <circle cx="282" cy="320" r="22"/>
    </g>

    <!-- CLI cue, kept intentionally simple. -->
    <path d="M154 393L213 433L154 473" fill="none" stroke="#ebdbb2" stroke-width="33"/>
    <path d="M246 473H314" fill="none" stroke="#ebdbb2" stroke-width="33"/>
  </g>

  </g>
</svg>

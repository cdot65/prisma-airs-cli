[package]
name = "airs-mcp"
description = "Optional protected runtime MCP service for Prisma AIRS history, collection and reports"
version = "8.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Workspace-only (RUNTIME_MCP_CONTRACT §1): never published; never a CLI dependency.
publish = false

[[bin]]
name = "airs-mcp"
path = "src/main.rs"

[dependencies]
airs-runtime-core = { path = "../airs-runtime-core", version = "=8.2.0" }
airs-history-store = { path = "../airs-history-store", version = "=8.2.0" }
# The frozen pins of contract §1 (qualified in M0 on MSRV 1.89).
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1"] }
serde = { version = "1.0", features = ["derive"] }
# Never enable `preserve_order`: feature unification would change SDK wire bytes.
serde_json = "1.0"
toml = { version = "=1.1.2", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = { version = "=0.10.9", default-features = false }
base64 = "0.22"
# Cursor tags (contract §4.2): HMAC-SHA256 over the pinned sha2.
hmac = "0.12"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
# Admission days in America/Chicago (contract §8), the same pin as core.
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
# The control store (contract §9.1): the same bundled SQLite pin as the history store.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "hooks", "limits", "serialize"] }
scm = { package = "scm-sdk", version = "=0.2.4", default-features = false, features = ["reqwest-transport", "scan", "management", "red-team", "dlp", "model-security", "gateway", "agentguard"] }

[dev-dependencies]
airs-test-harness = { path = "../airs-test-harness" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
http = "1"
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }

[lints]
workspace = true

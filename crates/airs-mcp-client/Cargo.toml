[package]
name = "airs-mcp-client"
description = "Optional MCP client for the airs CLI: gateway OAuth (PKCE), private session cache, typed bounded tool calls and durable operation receipts"
version = "9.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Published in lockstep with airs-cli (exact `=` version), after airs-runtime-core and
# before airs-cli (RUNTIME_MCP_CONTRACT §1; docs/RELEASING.md §2).
include = ["/src/**/*.rs", "/Cargo.toml", "/LICENSE", "/NOTICE", "/README.md"]

[dependencies]
airs-runtime-core = { path = "../airs-runtime-core", version = "=9.1.0" }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "auth", "reqwest", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1"
# The chunk encoding (contract §5); the version already in the lock file through rmcp.
base64 = "=0.22.1"
# Only for the `TokenResponse` trait rmcp does not re-export; the version rmcp resolves.
oauth2 = { version = "=5.0.0", default-features = false }
tokio = { version = "1.50", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

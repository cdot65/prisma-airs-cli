[package]
name = "airs-history-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

# Isolated feasibility gate; this is not an airs runtime dependency.
[workspace]

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "hooks", "limits"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

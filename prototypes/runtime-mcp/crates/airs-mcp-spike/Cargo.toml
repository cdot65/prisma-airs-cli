[package]
name = "airs-mcp-spike"
description = "M0.6 disposable protected echo/info MCP backend: no AIRS credentials, no customer history"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "=1.1.2", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = { version = "=0.10.9", default-features = false }
base64 = "0.22"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
http = "1"
airs-mcp-client = { path = "../airs-mcp-client" }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }

[lints]
workspace = true

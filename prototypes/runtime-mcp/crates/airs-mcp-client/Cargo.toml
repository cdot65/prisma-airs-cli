[package]
name = "airs-mcp-client"
description = "Optional MCP client for the airs CLI: gateway OAuth, typed tool calls and bounded artifact transfer (M0 skeleton)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = false
include = ["/src/**/*.rs", "/Cargo.toml"]

[dependencies]
# The production core (M1 moved the M0 skeleton into crates/airs-runtime-core).
airs-runtime-core = { path = "../../../../crates/airs-runtime-core", version = "=8.2.0-dev.1" }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "gzip", "stream"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true

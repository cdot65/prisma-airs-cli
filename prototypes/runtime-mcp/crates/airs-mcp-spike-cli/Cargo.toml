[package]
name = "airs-mcp-spike-cli"
description = "M0.6 CLI-side prototype: gateway OAuth (PKCE, loopback callback), private session cache, refresh, bounded calls and chunked download"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "auth", "reqwest", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1"
# Only for the `TokenResponse` trait rmcp does not re-export; same version rmcp resolves.
oauth2 = { version = "=5.0.0", default-features = false }
tokio = { version = "1.50", features = ["rt", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false }
base64 = "0.22"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
airs-mcp-spike = { path = "../airs-mcp-spike" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "form"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.50", features = ["rt-multi-thread", "process"] }

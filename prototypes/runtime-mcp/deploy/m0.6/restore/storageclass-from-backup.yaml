# Longhorn creates the volume from the named backup. Copy the backup URL from the
# Longhorn UI/`kubectl -n longhorn-system get backups` (it names no secret).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-airs-restore-drill
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  fsType: ext4
  fromBackup: "PLACEHOLDER_LONGHORN_BACKUP_URL"
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: airs-mcp-volume-crypto
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: airs-mcp-volume-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: airs-mcp-volume-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system

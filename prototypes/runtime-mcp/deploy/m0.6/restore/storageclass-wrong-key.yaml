# Negative control (runbook step 11.4): restoring with a WRONG passphrase must fail.
# Not part of kustomization.yaml; apply and delete explicitly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-airs-restore-wrong-key
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  fsType: ext4
  fromBackup: "PLACEHOLDER_LONGHORN_BACKUP_URL"
  encrypted: "true"
  csi.storage.k8s.io/provisioner-secret-name: airs-mcp-volume-crypto-wrong
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: airs-mcp-volume-crypto-wrong
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: airs-mcp-volume-crypto-wrong
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system

# Requires a SecretStore in longhorn-system that can read the Conjur variable
# below (add it following the cluster's existing per-namespace ESO pattern).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airs-mcp-volume-crypto
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef: {name: PLACEHOLDER_LONGHORN_SYSTEM_SECRETSTORE, kind: SecretStore}
  target:
    name: airs-mcp-volume-crypto
    template:
      data:
        CRYPTO_KEY_VALUE: "{{ .passphrase }}"
        CRYPTO_KEY_PROVIDER: secret
        CRYPTO_KEY_CIPHER: aes-xts-plain64
        CRYPTO_KEY_HASH: sha256
        CRYPTO_KEY_SIZE: "256"
        CRYPTO_PBKDF: argon2i
  data:
    - secretKey: passphrase
      remoteRef: {key: data/airs-mcp/backup/volume-passphrase}

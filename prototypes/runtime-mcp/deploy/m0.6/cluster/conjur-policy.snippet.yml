# Append to the cluster's Conjur policy following its conventions. The value is
# generated by the user (e.g. 48 random bytes, base64) and ALSO escrowed offline:
# losing both copies makes every backup of the encrypted volume unrecoverable.
- !policy
  id: airs-mcp
  body:
    - !policy
      id: backup
      body:
        - !variable
          id: volume-passphrase
          annotations:
            description: dm-crypt passphrase for longhorn-airs-encrypted volumes (airs-mcp data + backups)

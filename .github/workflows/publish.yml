name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      promote_version:
        description: Published CLI version to promote after harness acceptance
        type: string
        required: true
      harness_version:
        description: Published harness version that bundles this CLI
        type: string
        required: true

env:
  # pnpm/action-setup has no Node 24 major yet; force it (and any JS action) onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm test:release

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Migration releases are staged until the matching harness is accepted.
          tag=latest
          if [ "$RELEASE_PRERELEASE" = true ]; then tag=next; fi
          npm publish --access public --tag "$tag"

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Promote the accepted paired release
        env:
          PROMOTE_VERSION: ${{ inputs.promote_version }}
          HARNESS_VERSION: ${{ inputs.harness_version }}
        run: node scripts/promote-release.mjs
